---
- name: Install Slurm
  ansible.builtin.apt:
    name:
      - slurm-wlm
      - slurm-client
    state: present
    update_cache: true

- name: Create Slurm directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: slurm
    group: slurm
    mode: "0755"
  loop:
    - /etc/slurm
    - /var/log/slurm
    - /var/spool/slurmctld
    - /var/spool/slurmd

- name: Write slurm.conf
  ansible.builtin.template:
    src: slurm.conf.j2
    dest: /etc/slurm/slurm.conf
    owner: slurm
    group: slurm
    mode: "0644"
  notify: Restart Slurm services

- name: Write cgroup.conf
  ansible.builtin.template:
    src: cgroup.conf.j2
    dest: /etc/slurm/cgroup.conf
    owner: slurm
    group: slurm
    mode: "0644"
  notify: Restart Slurm services
