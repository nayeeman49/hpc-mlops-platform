---
- name: Install Munge
  ansible.builtin.apt:
    name: munge
    state: present
    update_cache: true

- name: Generate the cluster Munge key
  ansible.builtin.command: /usr/sbin/create-munge-key
  args:
    creates: /etc/munge/munge.key
  when: inventory_hostname == groups['controller'][0]

- name: Fetch the Munge key to the control node
  ansible.builtin.fetch:
    src: /etc/munge/munge.key
    dest: "{{ playbook_dir }}/.munge.key"
    flat: true
  when: inventory_hostname == groups['controller'][0]

- name: Install the shared Munge key
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/.munge.key"
    dest: /etc/munge/munge.key
    owner: munge
    group: munge
    mode: "0400"
  notify: Restart munge

- name: Enable Munge
  ansible.builtin.systemd:
    name: munge
    enabled: true
    state: started
